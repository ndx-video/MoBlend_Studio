[project]
name = "moblend-engine"
version = "0.0.0"
description = "Mo.Blend Python engine (bpy platform + broker entrypoint)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]  # bpy supplied by Blender; fastapi/uvicorn required for the M2+ broker (installed into Blender's python at dev time)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["moblend*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
