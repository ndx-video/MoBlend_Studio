<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mo.Blend Studio - Export Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#343439",
                        "surface-container-low": "#1a1b1f",
                        "on-surface-variant": "#c8c4d7",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#f8f7ff",
                        "secondary": "#aec6ff",
                        "tertiary-container": "#717178",
                        "on-secondary": "#002e6a",
                        "surface-tint": "#c6bfff",
                        "error-container": "#93000a",
                        "on-error": "#690005",
                        "on-surface": "#e3e2e7",
                        "secondary-fixed-dim": "#aec6ff",
                        "outline": "#928ea0",
                        "on-primary-fixed": "#160066",
                        "inverse-surface": "#e3e2e7",
                        "tertiary": "#c6c6ce",
                        "on-primary": "#2900a0",
                        "tertiary-fixed-dim": "#c6c6ce",
                        "surface-container": "#1e1f24",
                        "surface-container-highest": "#343439",
                        "tertiary-fixed": "#e3e1ea",
                        "surface-container-high": "#292a2e",
                        "primary-container": "#6c5ce7",
                        "on-tertiary-fixed-variant": "#46464d",
                        "surface": "#121317",
                        "primary-fixed": "#e4dfff",
                        "surface-bright": "#38393d",
                        "primary": "#c6bfff",
                        "secondary-container": "#0061d1",
                        "on-tertiary": "#2f3036",
                        "primary-fixed-dim": "#c6bfff",
                        "on-tertiary-fixed": "#1a1b21",
                        "on-background": "#e3e2e7",
                        "secondary-fixed": "#d8e2ff",
                        "on-secondary-container": "#dbe4ff",
                        "on-primary-fixed-variant": "#4029ba",
                        "background": "#121317",
                        "outline-variant": "#474554",
                        "surface-dim": "#121317",
                        "inverse-primary": "#5847d2",
                        "on-primary-container": "#faf6ff",
                        "surface-container-lowest": "#0d0e12",
                        "inverse-on-surface": "#2f3034",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#004395"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "unit": "4px",
                        "container-margin": "12px",
                        "sm": "8px",
                        "xl": "48px",
                        "md": "16px",
                        "xs": "4px",
                        "panel-gutter": "1px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "mono-label": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-sm": ["16px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "label-caps": ["10px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "mono-label": ["11px", { "lineHeight": "1.4", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #2D2E35;
            border-radius: 9999px;
        }
        .accent-gradient {
            background: linear-gradient(135deg, #6c5ce7 0%, #c6bfff 100%);
        }
        .modal-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex relative">
<!-- Background Context (Editor Mockup) -->
<div class="absolute inset-0 z-0 opacity-50 pointer-events-none flex">
<!-- Mock Sidebar -->
<div class="w-16 md:w-20 bg-surface-container border-r border-outline-variant h-full flex flex-col items-center py-md gap-lg">
<div class="w-10 h-10 rounded-lg bg-surface-variant"></div>
<div class="w-6 h-6 rounded bg-surface-variant"></div>
<div class="w-6 h-6 rounded bg-surface-variant"></div>
</div>
<!-- Mock Topbar & Canvas -->
<div class="flex-1 flex flex-col">
<div class="h-12 border-b border-outline-variant bg-surface-container"></div>
<div class="flex-1 bg-surface p-xl relative">
<div class="absolute inset-xl border border-outline-variant rounded-lg bg-surface-container-low" data-alt="A highly detailed 3D render of a futuristic neon city street scene, glowing with electric blue and violet lights. The scene is complex and dense, showing a work-in-progress digital art project. Dark, moody atmosphere suitable for a professional motion graphics workspace. Deep shadows and high contrast elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAhx3V18Qjh5c-IbQ8pmlAK1ErrYKUrAbB6zxtezLHjR-hQpILDRXZIbhl_gsWPQcJ5ND_y5un8PuYM4EMsLaq1u0fv71aE2AwOMg42-fENdxWp7I4fu_oRJDHS02ltYKc7iI43kySGPoyhDGjwI-I7pNp2KY0bnzTtv56rzSkKlYjP8c8tLUK3coQ9NyOEryOUlS-oV7uW1l3gQVgyz2veUDJYjap_Q5GDuXbi8fQuxHEoRW9oEqQYWgv2r_KB0WjFykaIWD2hMQ4H'); background-size: cover; background-position: center;"></div>
</div>
<!-- Mock Timeline -->
<div class="h-48 border-t border-outline-variant bg-surface-container-high"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="bg-surface-container-high border border-outline-variant rounded-xl modal-shadow w-full max-w-3xl flex flex-col max-h-[921px]">
<!-- Modal Header -->
<div class="flex items-center justify-between p-md border-b border-outline-variant shrink-0">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">output</span>
<h2 class="font-title-sm text-title-sm text-on-surface">Export Project</h2>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-sm rounded-lg hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Content (Scrollable) -->
<div class="flex-1 overflow-y-auto custom-scrollbar p-md flex flex-col gap-lg">
<!-- Destination Tabs -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block mb-sm">Destination</label>
<div class="flex gap-sm p-xs bg-surface-container rounded-lg border border-outline-variant">
<button class="flex-1 py-sm px-md rounded text-center font-title-sm text-title-sm bg-surface-variant text-primary font-medium shadow-sm transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
                            Save to File
                        </button>
<button class="flex-1 py-sm px-md rounded text-center font-title-sm text-title-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/50 transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">cast</span>
                            Send to OBS
                        </button>
<button class="flex-1 py-sm px-md rounded text-center font-title-sm text-title-sm text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/50 transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">tv</span>
                            Digital Signage
                        </button>
</div>
</div>
<!-- Format Cards -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block mb-sm">Format</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<!-- Card 1 (Active) -->
<div class="border border-primary rounded-lg p-md bg-surface-variant/50 cursor-pointer relative overflow-hidden group hover:bg-surface-variant transition-colors">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<span class="material-symbols-outlined text-primary mb-sm block">movie</span>
<div class="font-title-sm text-title-sm text-on-surface font-medium">MP4 Video</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-xs">H.264 / AAC</div>
</div>
<!-- Card 2 -->
<div class="border border-outline-variant rounded-lg p-md bg-surface-container cursor-pointer hover:bg-surface-variant/50 transition-colors relative">
<div class="absolute top-sm right-sm bg-primary-container/20 text-primary px-xs py-[2px] rounded text-[10px] font-bold uppercase tracking-wider">Alpha</div>
<span class="material-symbols-outlined text-on-surface-variant mb-sm block group-hover:text-primary transition-colors">layers</span>
<div class="font-title-sm text-title-sm text-on-surface font-medium">WebM</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Transparent</div>
</div>
<!-- Card 3 -->
<div class="border border-outline-variant rounded-lg p-md bg-surface-container cursor-pointer hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mb-sm block">all_inclusive</span>
<div class="font-title-sm text-title-sm text-on-surface font-medium">Looping</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Optimized GIF/Video</div>
</div>
<!-- Card 4 -->
<div class="border border-outline-variant rounded-lg p-md bg-surface-container cursor-pointer hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mb-sm block">image</span>
<div class="font-title-sm text-title-sm text-on-surface font-medium">PNG Seq</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Lossless frames</div>
</div>
</div>
</div>
<!-- Settings Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Dropdown -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block mb-sm">Resolution Preset</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg p-sm pl-md pr-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none">
<option>1080p Full HD (1920x1080)</option>
<option>4K Ultra HD (3840x2160)</option>
<option>Vertical HD (1080x1920)</option>
<option>Square (1080x1080)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Toggles -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider block mb-sm">Advanced Settings</label>
<div class="flex flex-col gap-sm">
<label class="flex items-center justify-between p-sm bg-surface-container border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-variant/30 transition-colors">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">texture</span>
<span class="font-body-md text-body-md text-on-surface">Transparent Background</span>
</div>
<div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-surface-variant checked:border-primary checked:bg-primary transition-transform duration-200 ease-in-out" name="toggle1" style="transform: translateX(100%);" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer" for="toggle1"></label>
</div>
</label>
<label class="flex items-center justify-between p-sm bg-surface-container border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-variant/30 transition-colors">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">loop</span>
<span class="font-body-md text-body-md text-on-surface">Loop Seamlessly</span>
</div>
<div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-surface-variant border-4 appearance-none cursor-pointer border-surface-variant checked:border-primary checked:bg-primary transition-transform duration-200 ease-in-out" name="toggle2" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-container-lowest cursor-pointer border border-outline-variant" for="toggle2"></label>
</div>
</label>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="p-md border-t border-outline-variant bg-surface-container flex flex-col gap-md shrink-0 rounded-b-xl">
<!-- Rendering Progress State (Simulated Active) -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<span class="font-mono-label text-mono-label text-primary">Rendering: Frame 141 of 300</span>
<span class="font-mono-label text-mono-label text-on-surface">47%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-1.5 overflow-hidden">
<div class="accent-gradient h-1.5 rounded-full w-[47%]"></div>
</div>
</div>
<div class="flex items-center justify-between mt-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">info</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Estimated Output: <strong class="text-on-surface font-medium">~5.0s @ 30fps (150MB)</strong></span>
</div>
<div class="flex gap-sm">
<button class="px-md py-sm rounded-lg border border-outline-variant font-title-sm text-title-sm text-on-surface hover:bg-surface-variant transition-colors">
                            Cancel
                        </button>
<button class="px-lg py-sm rounded-lg accent-gradient font-title-sm text-title-sm text-white font-medium shadow-md hover:opacity-90 transition-opacity flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px]">stop_circle</span>
                            Stop Export
                        </button>
</div>
</div>
</div>
</div>
</div>
<!-- Minimal Script for custom toggle visuals if needed, though handled mostly by CSS in this static example -->
<script>
        // Checkboxes require minor custom CSS in Tailwind to look like switches natively without a plugin, 
        // inline styles used above simulate the checked state visually for the demo.
    </script>
</body></html>
